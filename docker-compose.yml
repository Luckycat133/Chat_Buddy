# Local development stack for the Chat Buddy cloud runtime.
#
# Usage:
#   docker compose up -d
#   npm run db:migrate
#   npm run db:seed
#   npm run dev:server
#   npm run dev
#
# Production should use a managed Postgres (RDS / Cloud SQL / Supabase / Neon)
# plus an S3-compatible bucket and a real APNs key. This file is for
# local development only.

services:
  postgres:
    image: postgres:16-alpine
    container_name: chat_buddy_pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: chat_buddy
      POSTGRES_USER: chat_buddy
      POSTGRES_PASSWORD: dev_only_change_me
    ports:
      - '5432:5432'
    volumes:
      - chat_buddy_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U chat_buddy -d chat_buddy']
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional: pg-boss dashboard for inspecting the durable job queue.
  # Not started by default; run with `--profile queue` to enable.
  pgadmin:
    profiles: ['admin']
    image: dpage/pgadmin4:latest
    container_name: chat_buddy_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: dev@local.test
      PGADMIN_DEFAULT_PASSWORD: dev_only_change_me
      PGADMIN_LISTEN_PORT: 80
    ports:
      - '5050:80'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  chat_buddy_pg_data:
    name: chat_buddy_pg_data