name: Publish exact source release once
on:
  push:
    branches: ['dots/publish-v0.5.5-once']
    paths: ['.github/workflows/publish-v0.5.5-once.yml']
permissions:
  contents: write
  actions: read
jobs:
  publish:
    if: github.repository == 'Luckycat133/Chat_Buddy'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify default branch and its green CI, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: 'v0.5.5'
          TARGET: '33ae88ef54f150608e8c7165be8f210c65d449ad'
          DEFAULT_BRANCH: 'remake'
          CI_RUNS: '46013817474 46013817515'
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'Luckycat133/Chat_Buddy'
          test "$GITHUB_REF" = 'refs/heads/dots/publish-v0.5.5-once'
          [[ "$TAG" =~ ^v0\.[0-9]+\.[0-9]+$ ]]
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq '.default_branch')" = "$DEFAULT_BRANCH"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$DEFAULT_BRANCH" --jq '.object.sha')" = "$TARGET"
          for run in $CI_RUNS; do
            test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq '.head_sha + ":" + .event + ":" + .conclusion')" = "$TARGET:push:success"
          done
          if ! ref="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.type + ":" + .object.sha' 2>/dev/null)"; then
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$TAG" -f "sha=$TARGET" >/dev/null
            ref="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.type + ":" + .object.sha')"
          fi
          test "$ref" = "commit:$TARGET"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName --jq '.tagName' >/dev/null 2>&1; then
            echo 'Release already exists; refusing to overwrite'
            exit 1
          fi
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          ## Changes

          Adds dry-run preview and explicit append-only restore from private Web v2 archives. Restored messages use an authorized, paginated read-only timeline; attachments are checked and scoped by ID. Restores are transactional and subject to persistent per-account quotas.

          ## Scope

          Only supported messages authored by the account owner in eligible existing private conversations are appended. No shared-chat, existing-message, membership or permission overwrite. Tested with synthetic data. This GitHub Release provides source only; no production deployment or signed application build.

          ## Verification

          - [Pull request](https://github.com/Luckycat133/Chat_Buddy/pull/57)
          - [Verified default-branch CI](https://github.com/Luckycat133/Chat_Buddy/actions/runs/46013817474)
          NOTES
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          test "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease --jq '[.tagName,.isDraft,.isPrerelease] | @tsv')" = "$(printf '%s\tfalse\tfalse' "$TAG")"
