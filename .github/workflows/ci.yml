name: CI

env:
  TZ: UTC

on:
  push:
    branches: [main, remake]
  pull_request:
    branches: [main, remake]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci --include=optional
          npm install --no-save @rolldown/binding-linux-x64-gnu@1.0.1 @tailwindcss/oxide-linux-x64-gnu@4.3.0

      - name: Run linter
        run: npm run lint

      - name: Audit dependencies
        run: npm audit

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci --include=optional
          npm install --no-save @rolldown/binding-linux-x64-gnu@1.0.1 @tailwindcss/oxide-linux-x64-gnu@4.3.0

      - name: Run unit tests
        run: npm run test -- --run

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci --include=optional
          npm install --no-save @rolldown/binding-linux-x64-gnu@1.0.1 @tailwindcss/oxide-linux-x64-gnu@4.3.0

      - name: Build production bundle
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/remake'
        with:
          name: dist
          path: dist/
          retention-days: 7

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [lint, test, build]
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci --include=optional
          npm install --no-save @rolldown/binding-linux-x64-gnu@1.0.1 @tailwindcss/oxide-linux-x64-gnu@4.3.0

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Run E2E tests
        run: npm run test:e2e -- --project=chromium

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  coverage:
    name: Test Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci --include=optional
          npm install --no-save @rolldown/binding-linux-x64-gnu@1.0.1 @tailwindcss/oxide-linux-x64-gnu@4.3.0

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: test_reports/coverage/
          retention-days: 14
