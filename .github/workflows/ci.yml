name: CI

on:
  push:
    branches: [remake, main]
  pull_request:
    branches: [remake, main]

env:
  NODE_VERSION: '22'

jobs:
  lint-typecheck-test:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: npx tsc -p tsconfig.json --noEmit
      - run: npx eslint server shared db src/api src/sync
      - run: npx vitest run --reporter=default
      - name: Upload vitest coverage
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: vitest-coverage
          path: test_reports/coverage
          retention-days: 14

  web-build:
    name: Web build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - name: Build
        env:
          VITE_CLOUD_BASE_URL: 'http://localhost:8080'
        run: npm run build
      - name: Verify no secrets leaked into bundle
        run: |
          node --test scripts/check-bundle-secrets.test.mjs
          node scripts/check-bundle-secrets.mjs dist/ public/ assets/
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: dist/
          retention-days: 7

  e2e-p0:
    name: Playwright A01-A25 P0 acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint-typecheck-test, web-build]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: chat_buddy
          POSTGRES_USER: chat_buddy
          POSTGRES_PASSWORD: chat_buddy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chat_buddy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://chat_buddy:chat_buddy@127.0.0.1:5432/chat_buddy
      SESSION_SIGNING_KEY: 'test-signing-key-do-not-use-in-prod-please'
      NODE_ENV: test
      LOG_LEVEL: warn
      HOST: '127.0.0.1'
      PORT: 8080
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Verify migration and upgrade on PostgreSQL
        env:
          MIGRATION_TEST_DATABASE_URL: postgres://chat_buddy:chat_buddy@127.0.0.1:5432/chat_buddy
        run: npm run db:test-migrations
      - name: Apply migrations
        run: npm run db:migrate
      - name: Seed
        run: npm run db:seed
      - name: Build web app for preview server
        run: npm run build
      - name: Compile server
        run: npm run build:server
      - name: Boot compiled server
        run: |
          setsid npm run start:server > "$RUNNER_TEMP/chat-buddy-server.log" 2>&1 &
          SERVER_PID=$!
          echo "$SERVER_PID" > "$RUNNER_TEMP/chat-buddy-server.pid"
          ready() {
            curl --max-time 2 -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1 &&
              curl --max-time 2 -fsS http://127.0.0.1:8080/readyz >/dev/null 2>&1
          }
          for i in $(seq 1 60); do
            if ready; then
              echo "server ready after $i attempts"
              break
            fi
            sleep 1
          done
          if ! ready; then
            echo '::error::Compiled server or PostgreSQL did not become ready'
            cat "$RUNNER_TEMP/chat-buddy-server.log"
            exit 1
          fi
      - name: Run A01-A25
        env:
          E2E_CLOUD_BASE_URL: 'http://127.0.0.1:8080'
        run: npx playwright test e2e/p0-acceptance.spec.js
      - name: Stop server
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/chat-buddy-server.pid" ]; then
            kill -- "-$(cat "$RUNNER_TEMP/chat-buddy-server.pid")" || true
          fi
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
