name: CI

on:
  push:
    branches: [remake, main]
  pull_request:
    branches: [remake, main]

env:
  NODE_VERSION: '22'

jobs:
  lint-typecheck-test:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: npx tsc -p tsconfig.json --noEmit
      - run: npx eslint server shared db src/api src/sync
      - run: npx vitest run --reporter=default
      - name: Upload vitest coverage
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-coverage
          path: test_reports/coverage
          retention-days: 14

  web-build:
    name: Web build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - name: Build
        env:
          VITE_CLOUD_BASE_URL: 'http://localhost:8080'
        run: npm run build
      - name: Verify no secrets leaked into bundle
        run: |
          set -euo pipefail
          if grep -RInE 'sk-(or|cp)|tvly-' dist/ public/ assets/ 2>/dev/null; then
            echo '::error::Bundled JS contains a real provider key'
            exit 1
          fi
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/
          retention-days: 7

  e2e-p0:
    name: Playwright A01-A25 P0 acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint-typecheck-test, web-build]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: chat_buddy
          POSTGRES_USER: chat_buddy
          POSTGRES_PASSWORD: chat_buddy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chat_buddy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://chat_buddy:chat_buddy@localhost:5432/chat_buddy
      SESSION_SIGNING_KEY: ${{ secrets.SESSION_SIGNING_KEY || 'test-signing-key-do-not-use-in-prod-please' }}
      NODE_ENV: test
      LOG_LEVEL: warn
      PORT: 8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Apply migrations
        run: |
          # Must be exported: a bare `PGPASSWORD=x` assignment stays a shell-local
          # variable and psql never sees it (fe_sendauth: no password supplied).
          export PGPASSWORD=chat_buddy
          # Apply the hand-curated migration (matches drizzle-kit output).
          psql -h localhost -U chat_buddy -d chat_buddy -f db/migrations/0000_init_cloud_runtime.sql
      - name: Seed
        run: npm run db:seed
      - name: Boot server
        run: |
          npm run dev:server &
          SERVER_PID=$!
          # Wait for /healthz to return 200.
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/healthz >/dev/null 2>&1; then
              echo "server ready after $i attempts"
              break
            fi
            sleep 1
          done
          if ! curl -fsS http://localhost:8080/healthz >/dev/null 2>&1; then
            echo '::error::Server failed to start within 60s'
            kill $SERVER_PID || true
            exit 1
          fi
          # Keep server alive for the duration of the playwright run via a sentinel.
          echo $SERVER_PID > /tmp/server.pid
      - name: Build web app for preview server
        # playwright.config webServer runs `npm run preview` (vite preview on
        # 4173) which needs dist/ — without this build it times out waiting
        # (120s) and the whole e2e-p0 job dies before any test runs.
        run: npm run build
      - name: Run A01-A25
        env:
          E2E_CLOUD_BASE_URL: 'http://localhost:8080'
        run: npx playwright test e2e/p0-acceptance.spec.js
      - name: Stop server
        if: always()
        run: |
          if [ -f /tmp/server.pid ]; then
            kill $(cat /tmp/server.pid) || true
          fi
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
