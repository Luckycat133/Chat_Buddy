<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome | Chat Buddy Remake</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Source+Sans+3:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f9f9f9;
            --text-color: #1a1a1a;
            --accent-color: #d4af37; /* Gold accent */
            --font-heading: 'Playfair Display', serif;
            --font-body: 'Source Sans 3', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-body);
            line-height: 1.6;
            overflow-x: hidden;
            display: flex;
            min-height: 100vh;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 1200px;
            width: 90%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            align-items: center;
        }

        .hero-content {
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInUp 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            font-family: var(--font-heading);
            font-size: clamp(3rem, 8vw, 6rem);
            font-weight: 400;
            line-height: 1.1;
            margin-bottom: 2rem;
            letter-spacing: -0.02em;
        }

        h1 span {
            display: block;
            font-style: italic;
            color: var(--accent-color);
        }

        .description {
            font-size: 1.25rem;
            max-width: 400px;
            font-weight: 300;
            margin-bottom: 3rem;
            border-left: 2px solid var(--accent-color);
            padding-left: 1.5rem;
        }

        .cta {
            display: inline-block;
            text-decoration: none;
            color: var(--text-color);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            position: relative;
            padding-bottom: 5px;
        }

        .cta::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 1px;
            background-color: var(--text-color);
            transform: scaleX(0);
            transform-origin: right;
            transition: transform 0.6s cubic-bezier(0.19, 1, 0.22, 1);
        }

        .cta:hover::after {
            transform: scaleX(1);
            transform-origin: left;
        }

        .visual-element {
            position: relative;
            height: 600px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
        }

        .shape {
            width: 80%;
            height: 80%;
            background: linear-gradient(135deg, #eee 0%, #ddd 100%);
            border-radius: 2px;
            box-shadow: 40px 40px 80px rgba(0,0,0,0.05);
            position: relative;
            z-index: 1;
            overflow: hidden;
        }

        .shape::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.1) 0%, transparent 70%);
            animation: drift 20s infinite linear;
        }

        @keyframes drift {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .meta-text {
            position: absolute;
            bottom: 0;
            right: 0;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.3em;
            writing-mode: vertical-rl;
            color: #999;
            padding-bottom: 2rem;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
                text-align: center;
            }
            .description {
                margin: 0 auto 3rem;
                padding-left: 0;
                border-left: none;
            }
            .visual-element {
                height: 300px;
                justify-content: center;
            }
            .meta-text {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <section class="hero-content">
            <h1>Chat Buddy <span>Remake</span></h1>
            <p class="description">
                A sophisticated evolution of digital companionship. Re-imagined for the modern aesthetic.
            </p>
            <a href="#" class="cta">Explore the interface</a>
        </section>
        <section class="visual-element">
            <div class="shape"></div>
            <div class="meta-text">Est. 2026 / Version 2.0</div>
        </section>
    </div>
</body>
</html>
